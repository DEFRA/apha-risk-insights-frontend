services:
  apha-risk-insights-frontend:
    build:
      context: .
      target: development
    image: apha-risk-insights-frontend-development
    container_name: apha-risk-insights-frontend-development
    links:
      - 'floci:floci'
      - 'redis:redis'
    depends_on:
      floci:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - 'compose/aws.env'
    environment:
      PORT: 3000
      NODE_ENV: development
      REDIS_HOST: redis
      REDIS_TLS: false
      USE_SINGLE_INSTANCE_CACHE: true
      LOG_FORMAT: pino-pretty
      SESSION_COOKIE_SECURE: false
    volumes:
      - ./src:/home/node/src
      - ./package.json:/home/node/package.json
    networks:
      - apha-risk

  # floci is a replacement for localstack. It emulates AWS resources (sqs, sns, s3 etc) for local development
  # See: https://floci.io for more details
  floci:
    image: hectorvent/floci:latest-aws
    env_file:
      - 'compose/aws.env'
    environment:
      FLOCI_DEFAULT_REGION: eu-west-2
    volumes:
      - ./compose/floci/start.d:/etc/floci/init/start.d:ro
    networks:
      - apha-risk

  redis:
    image: redis:7.2.3-alpine3.18
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - apha-risk

networks:
  apha-risk:
    driver: bridge
    name: apha-risk
