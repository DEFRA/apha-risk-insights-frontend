name: Check Pull Request

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

jobs:
  pr-validator:
    name: Run Pull Request Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Test code and Create Test Coverage Reports
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Security audit
        run: npm run security-audit

      - run: |
          npm ci
          npm run format:check
          npm run lint
          mkdir -p coverage
          chmod -R a+rw ./coverage
          docker compose -p apha-risk-insights-frontend-test -f compose.yaml -f compose.test.yaml run --build --rm apha-risk-insights-frontend

      - name: Test Docker Image Build
        run: |
          set +e
          docker build --no-cache --tag apha-risk-insights-frontend .
          exit $?

